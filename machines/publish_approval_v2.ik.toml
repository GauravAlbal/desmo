# Same lifecycle plus withdraw. New aggregates only. Do not rebind v1 rows.
schema_version = 1
machine_id = "publish_approval"
machine_version = 2
name = "PublishApproval"

[facts]
artifact_digest = { type = "string", policy = "replace" }
approved_digest = { type = "string", policy = "replace" }

[states]
draft = { initial = true }
approved = {}
published = { terminal = true }

[commands.edit]
from = ["draft"]
to = "draft"
args = { artifact_digest = "string" }
then = { artifact_digest = "$artifact_digest" }

[commands.approve]
from = ["draft"]
to = "approved"
args = { artifact_digest = "string" }
when = "exists(artifact_digest) && $artifact_digest == artifact_digest"
then = { approved_digest = "$artifact_digest" }

[commands.revise]
from = ["approved"]
to = "draft"
args = { artifact_digest = "string" }
then = { artifact_digest = "$artifact_digest" }

[commands.withdraw]
from = ["approved"]
to = "draft"

[commands.publish]
from = ["approved"]
to = "published"
when = "exists(approved_digest) && artifact_digest == approved_digest"

[invariants.pub_inv_001]
when = "state == 'published'"
assert = "exists(artifact_digest) && exists(approved_digest) && artifact_digest == approved_digest"
