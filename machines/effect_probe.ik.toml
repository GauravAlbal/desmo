# EffectProbe — generic fixture machine exercising K2.5 effect identity without any
# consumer concepts. `plan` creates one pending effect intent; outcomes are bound by the
# runtime `record` operation; `finish` moves the domain state.
schema_version = 1
machine_id = "effect_probe"
machine_version = 1
name = "EffectProbe"

[facts]
payload_digest = { type = "string", policy = "replace" }
result_digest = { type = "string", policy = "replace" }

[states]
idle = { initial = true }
planned = {}
finished = { terminal = true }

[commands.plan]
from = ["idle"]
to = "planned"
args = { effect_id = "string", payload_digest = "string", idempotency_key = "string" }
then = { payload_digest = "$payload_digest" }
effect = { kind = "WORK", id = "$effect_id", payload_digest = "$payload_digest", idempotency_key = "$idempotency_key" }

[commands.finish]
from = ["planned"]
to = "finished"
args = { result_digest = "string" }
then = { result_digest = "$result_digest" }
