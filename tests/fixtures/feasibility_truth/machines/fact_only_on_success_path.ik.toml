schema_version = 1
machine_id = "fact_only_on_success_path"
machine_version = 1

[facts]
token = { type = "string", policy = "replace" }
[states]
idle = { initial = true }
held = {}
done = {}
[commands.take]
from = ["idle"]
then = { token = '"held"' }
to = "held"
[commands.skip]
from = ["idle"]
to = "done"
[commands.use]
from = ["held"]
when = 'token == "held"'
to = "done"

