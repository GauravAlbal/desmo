schema_version = 2
machine_id = "schema2_always_true_first"
machine_version = 1

[regions.lane.states]
start = { initial = true }
ok = {}
rare = {}
[regions.lane.commands.go]
from = ["start"]
args = { x = "int" }
outcomes = [
  { when = "$x >= 0 || $x < 0", to = "ok" },
  { when = "$x == 3", to = "rare" }
]

