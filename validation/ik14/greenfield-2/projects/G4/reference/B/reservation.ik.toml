schema_version = 1
machine_id = "g4_reservation"
machine_version = 1
name = "EquipmentReservation"

[facts]
member_id = { type = "string", policy = "replace" }
item_id = { type = "string", policy = "replace" }
operation_id = { type = "string", policy = "replace" }
attempts = { type = "int", policy = "counter", initial = 0 }
equipment_id = { type = "string", policy = "replace" }
hold_reason = { type = "string", policy = "replace" }
sent = { type = "int", policy = "replace", initial = 0 }

[states]
queued = { initial = true }
uncertain = {}
reserved = { terminal = true }
rejected = { terminal = true }
cancelled = { terminal = true }
hold = {}

[commands.reserve]
from = ["queued"]
to = "queued"
args = { member_id = "string", item_id = "string", operation_id = "string" }
then = { member_id = "$member_id", item_id = "$item_id", operation_id = "$operation_id" }

[commands.dispatch]
from = ["queued"]
to = "uncertain"
then = { sent = "1" }

[commands.grant]
from = ["uncertain"]
to = "reserved"
args = { equipment_id = "string" }
then = { equipment_id = "$equipment_id" }

[commands.deny]
from = ["uncertain"]
outcomes = [ { when = "attempts + 1 < 3", to = "queued", then = { attempts = "+1" } }, { when = "attempts + 1 >= 3", to = "rejected", then = { attempts = "+1" } } ]

[commands.conflict]
from = ["uncertain"]
to = "rejected"

[commands.cancel]
from = ["queued", "uncertain", "hold"]
to = "cancelled"

[commands.hold]
from = ["queued"]
to = "hold"
args = { hold_reason = "string" }
when = "sent == 0"
then = { hold_reason = "$hold_reason" }
